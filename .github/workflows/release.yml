name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-node:
    name: Build Node
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache-dependency-path: node/go.sum

      - name: Build Node Binary
        working-directory: ./node
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X github.com/Archive-At-Home/archive-at-home/node/internal/version.Version=${{ github.ref_name }}" -o archive-at-home-node.exe ./cmd/node
            zip archive-at-home-node-${{ matrix.goos }}-${{ matrix.goarch }}.zip archive-at-home-node.exe
          else
            CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w -X github.com/Archive-At-Home/archive-at-home/node/internal/version.Version=${{ github.ref_name }}" -o archive-at-home-node ./cmd/node
            tar -czf archive-at-home-node-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz archive-at-home-node
          fi

      - name: Upload Node Binary
        uses: actions/upload-artifact@v7
        with:
          name: node-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            node/*.tar.gz
            node/*.zip

  docker-node:
    name: Docker Node
    runs-on: ubuntu-latest
    needs: build-node
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Node Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: node-binary-linux-*
          path: ./node-artifacts

      - name: Unpack Node Binaries
        run: |
          mkdir -p node/bin/amd64 node/bin/arm64
          tar -xzf node-artifacts/node-binary-linux-amd64/archive-at-home-node-linux-amd64.tar.gz -C node/bin/amd64
          tar -xzf node-artifacts/node-binary-linux-arm64/archive-at-home-node-linux-arm64.tar.gz -C node/bin/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/node
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-node, docker-node]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/node-binary-*/*.tar.gz
            artifacts/node-binary-*/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
